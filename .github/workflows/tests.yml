# Runs on every push: backend tests (simulation, no Docker, no model), frontend tests, type check and build.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        env:
          RUNNER: sim
        run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - name: Frontend tests, type check and build
        working-directory: frontend
        run: npm test && npm run build
