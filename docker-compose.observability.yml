# Optional open-source observability overlay: cAdvisor (container metrics) -> Prometheus -> Grafana.
# Start: docker compose -p observability -f docker-compose.observability.yml up -d
# Grafana http://localhost:3000/d/chaos-sentinel (anonymous viewer), Prometheus http://localhost:9090, cAdvisor http://localhost:8082
# Chaos Sentinel's own probe numbers remain the source of truth for outcomes; this shows the containers' side.
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["8082:8080"]
    command: ["--docker_only=true", "--housekeeping_interval=2s"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports: ["3000:3000"]
