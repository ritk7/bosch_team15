global:
  scrape_interval: 2s
scrape_configs:
  - job_name: chaos-sentinel        # our probe and guard measurements, from the backend's /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: cadvisor              # container metrics; on some Docker Desktop versions cAdvisor cannot see containers
    static_configs:
      - targets: ["cadvisor:8080"]
